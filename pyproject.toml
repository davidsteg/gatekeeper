[project]
name = "gatekeeper"
version = "1.4.0"
description = "Controlled MCP server for host operations"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "pyyaml>=6.0",
    "uvicorn>=0.34",
    "httpx>=0.27",
    "websockets>=13.0",
    "cryptography>=43.0",
    "asyncssh>=2.14",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.0",
    # The console's JSON API (`/api/v1`, src/gatekeeper/api/). FastAPI is
    # Starlette-based, so it mounts into the existing app; pydantic models
    # are the API's output boundary.
    "fastapi>=0.115",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "pip-audit>=2.7",
]

[project.scripts]
gatekeeper = "gatekeeper.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# `_web/` is the React console's build (frontend/dist, including the web-app
# manifest and icon), copied in by the Dockerfile's node stage and served at
# /app by api/web.py. Data files, not modules: without this they are dropped
# from the wheel and /app answers 503 in the image while working fine in an
# editable checkout.
[tool.setuptools.package-data]
gatekeeper = ["_web/*", "_web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored google-workspace skill scripts (execute_google.py runs them as
# a subprocess, they are not importable gatekeeper code) -- excluded from
# linting: they have their own style (E402 sys.path manipulation before
# import is intentional) and live in this repo only to be baked into the
# image via Dockerfile COPY.
exclude = ["src/gatekeeper/_google_api"]

[tool.ruff.lint]
# E/F: pycodestyle errors + pyflakes -- real bugs and dead code, not style
# opinions. I: import sorting, cheap to keep consistent. UP: pyupgrade,
# flags the stdlib idiom this project's own 3.12 floor already allows.
# B: flake8-bugbear, catches a handful of correctness footguns (mutable
# default args, bare except-pass) that are worth a second look each time.
# Deliberately not "ALL": several available categories (blind-except,
# try-except-pass, ...) restyle existing, deliberate error-handling choices
# and belong in a considered follow-up, not a blanket lint gate.
select = ["E", "F", "I", "UP", "B"]
# Long lines are this codebase's own style in ui.py's HTML-building
# f-strings, not an oversight -- reformatting ~5800 lines to fit a column
# limit is a separate, considered pass, not something a lint gate should
# force as a side effect of adding one.
ignore = [
    "E501",
    # UP042 (str,Enum -> StrEnum) has no *safe* autofix, and DenialReason's
    # exact `str`-subclass behaviour is relied on for its `.value` in the
    # audit log and denial responses -- worth a considered, verified change,
    # not a lint-driven one.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are declared as argument defaults by design
# (api/); they are immutable markers, not shared mutable state.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
