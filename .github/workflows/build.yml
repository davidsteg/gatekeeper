name: build

# Jede Aenderung ist ein Release. Ausgeloest wird es nicht von einem
# handgesetzten Tag, sondern von der Version in pyproject.toml: steht dort eine
# Fassung, zu der es noch kein Tag gibt, wird sie veroeffentlicht. Ein Release
# entsteht damit im selben Commit wie die Aenderung -- und wer die Version
# vergisst, merkt es daran, dass nichts erscheint.
#
# Getrennte Jobs mit Abhaengigkeit: veroeffentlicht wird nur, wenn die Tests
# vorher durchgelaufen sind. gatekeeper haelt root-aequivalenten Zugriff auf
# den Host; ein Image mit rotem Negativkorpus darf nicht in die Registry.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: davidsteg/gatekeeper

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      series: ${{ steps.version.outputs.series }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags werden gebraucht, um zu erkennen, ob diese Version schon
          # veroeffentlicht wurde.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Decide whether this is a release
        id: version
        run: |
          version=$(python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # '1.2' zeigt auf die neueste 1.2.x -- wer die Reihe pinnen will,
          # bekommt Fehlerbehebungen, aber keine neuen Funktionen.
          echo "series=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml ($version)." \
                 "An image would report a version it does not have."
            exit 1
          fi

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version is already released -- building a dev image only."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Eine Version ohne Notizen wird nicht veroeffentlicht. Die Pruefung
          # steht hier, vor dem Image-Job: schlaegt sie fehl, liegt noch nichts
          # in der Registry, dessen Release dann fehlt.
          notes=$(awk -v v="$version" '
            $0 ~ "^## " v "([[:space:]]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' RELEASE.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::RELEASE.md has no '## $version' section." \
                 "Every change gets a release, and every release gets notes."
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "Will release v$version ($(echo "$notes" | wc -l) lines of notes)."

      - name: Install
        run: pip install -e ".[dev]" -c constraints.txt

      - name: Audit dependencies (pip-audit)
        run: pip-audit

      - name: Lint (ruff)
        # Scoped to src/ only: tests/ carries a handful of pre-existing,
        # deliberate idioms (assert False, broad pytest.raises(Exception))
        # that are a style call, not a bug -- gating on them here would
        # force a rewrite of test files as a side effect of adding a
        # linter, which is its own considered change. E501/UP042 are
        # excluded per pyproject.toml's own comments.
        run: ruff check src/

      - name: Type check (mypy)
        # Informational, not gating: the first run against this codebase
        # surfaces ~30 pre-existing findings (mostly the MCP SDK's
        # pydantic camelCase aliases, e.g. inputSchema vs input_schema,
        # that mypy doesn't resolve without its pydantic plugin) that are
        # a considered backlog, not something to fix blind under a lint
        # gate. Kept running so the signal is visible without blocking
        # the build on it.
        run: mypy src/gatekeeper || true

      - name: Test suite
        # Unter Linux laufen auch die Faelle, die unter Windows uebersprungen
        # werden -- allen voran der Symlink-Ausbruch aus dem Negativkorpus.
        run: pytest -q

      - name: Validate the empty state
        # Der Weg, den jede Erstinstallation nimmt. Er muss zu einer Lage
        # fuehren, die laedt -- ohne dass irgendetwas vorkonfiguriert waere.
        run: |
          gatekeeper init --config-dir /tmp/blank | tee /tmp/init.log
          grep -q 'toolkits: {}' /tmp/blank/toolkits.yaml
          grep -q 'tools: \[\]' /tmp/blank/tools.yaml
          gatekeeper \
            --toolkits /tmp/blank/toolkits.yaml \
            --tools /tmp/blank/tools.yaml \
            --identities /tmp/blank/identities.yaml \
            check | tee /tmp/check.log
          grep -q '0 toolkits, 0 tools, 1 identities' /tmp/check.log

      - name: Validate the examples
        # Die Beispiele sind das, wovon jemand abschreibt. Ein Tippfehler darin
        # faellt sonst erst auf einem fremden Host auf.
        run: |
          hash=$(gatekeeper token | grep -oE 'scrypt\$[^[:space:]]+')
          printf 'identities:\n  - id: ci\n    role: admin\n    token_hash: "%s"\n    tools: []\n    scopes: []\n' \
            "$hash" > /tmp/identities.yaml
          gatekeeper \
            --toolkits config/examples/toolkits.yaml \
            --tools config/examples/tools.yaml \
            --identities /tmp/identities.yaml \
            check

  test-privileged:
    name: tests (root)
    # Tests, die eine Privilegiengrenze zusichern, überspringen sich selbst,
    # wenn der Prozess nicht root ist -- auf dem normalen Runner also immer.
    # Damit lief ausgerechnet das in keinem Lauf mit: dass der Drop wirklich
    # Autorität abgibt, dass root danach nicht zurückzuholen ist, dass keine
    # Capability übrig bleibt, dass ein 'local'-Binary keine ambient Caps
    # erbt. Ein Container-Job läuft als root und schließt diese Lücke.
    #
    # `options` gibt dem Container die Capabilities, die die GATEKEEPER_KEEP_CAPS
    # Tests brauchen: DAC_OVERRIDE und DAC_READ_SEARCH müssen im Bounding Set
    # sein, damit `capset` sie in den permitted/inheritable/ambient Set legen
    # kann. Ohne sie schlägt der Drop mit EPERM fehl -- exakt der Mechanik, die
    # der Bug reproduziert, nur hier im Test-Container statt im deployten
    # Gatekeeper.
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
      options: --cap-add CAP_DAC_OVERRIDE --cap-add CAP_DAC_READ_SEARCH --cap-add CAP_SETUID --cap-add CAP_SETGID
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: pip install -e ".[dev]" -c constraints.txt

      - name: Verify the job is actually privileged
        # Ohne diese Pruefung wuerde ein Runner ohne die Capabilities die
        # Tests stillschweigend wieder ueberspringen -- gruen, aber ohne
        # irgendetwas zugesichert zu haben.
        run: |
          python - <<'PY'
          import os, sys
          caps = next(int(l.split(":")[1], 16) for l in open("/proc/self/status")
                      if l.startswith("CapEff:"))
          setid = (1 << 7) | (1 << 6)   # CAP_SETUID | CAP_SETGID
          print(f"uid={os.geteuid()} CapEff={caps:016x}")
          if os.geteuid() != 0 or (caps & setid) != setid:
              sys.exit("::error::this job must run as root with CAP_SETUID/CAP_SETGID")
          PY

      - name: Test suite, as root
        # Die ganze Suite, nicht die eine Datei mit den Privilegien-Tests.
        # Eine Dateiliste an dieser Stelle ist genau die Wartung, die beim
        # naechsten needs_root-Test in einer neuen Datei vergessen wird --
        # zwischen 0.30.0 und 0.30.1 ist das prompt passiert, tests/
        # test_unpriv.py lief hier nicht mit. So gibt es nichts zu vergessen,
        # und der Job kostet nur Laufzeit, die parallel zum normalen liegt.
        run: pytest -q

  image:
    name: image
    needs: [test, test-privileged]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Der Digest wandert ins Release: ein Tag laesst sich ueberschreiben,
      # ein Digest nicht. Wer danach pinnt, bekommt garantiert dieses Image.
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # Fuer linux/arm64 auf einem amd64-Runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Bei Pull Requests wird nur gebaut, nicht veroeffentlicht: ein Fork
        # duerfte sonst ueber einen PR ein Image unter unserem Namen schieben.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        env:
          VERSION: ${{ needs.test.outputs.version }}
          RELEASING: ${{ needs.test.outputs.release }}
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # Nur Versionen, keine Zweig- oder Commit-Namen: ein Tag wie
          # 'sha-c8598dc' sagt nicht, was drin ist.
          #
          # Ist die Version neu, entstehen '1.2.3' und '1.2'. Ist sie schon
          # veroeffentlicht, gibt es '1.2.3-dev' -- erkennbar unfertig und
          # trotzdem eine Version.
          #
          # 'latest' zeigt immer auf den neuesten Bau, ohne Ausnahme. Da nach
          # der Regel in RELEASE.md jede Aenderung ein Release ist, ist das in
          # aller Regel auch das neueste Release; ein '-dev' dazwischen ist der
          # Ausnahmefall. Fuer den Betrieb bleibt eine feste Version richtig
          # (NFR-5) -- 'latest' bewegt sich, und ein Redeploy zieht dann eine
          # andere Fassung, ohne dass jemand es entschieden haette.
          tags: |
            type=raw,value=${{ env.VERSION }},enable=${{ env.RELEASING == 'true' }}
            type=raw,value=${{ needs.test.outputs.series }},enable=${{ env.RELEASING == 'true' }}
            type=raw,value=${{ env.VERSION }}-dev,enable=${{ env.RELEASING != 'true' }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        # Erstinstallation im Container nachstellen: 'init' schreibt den
        # Leerzustand, 'check' liest ihn zurueck. Beides unprivilegiert.
        if: github.event_name != 'pull_request'
        run: |
          # Gezielt 'latest': es zeigt nach jedem Push auf genau diesen Bau,
          # unabhaengig davon, in welcher Reihenfolge die Tags erzeugt wurden.
          tag="${IMAGE}:latest"
          docker pull "$tag"
          docker run --rm --entrypoint docker "$tag" compose version
          mkdir -p /tmp/gk && chmod 777 /tmp/gk
          docker run --rm --user 568:568 -v /tmp/gk:/etc/gatekeeper "$tag" init
          docker run --rm --user 568:568 -v /tmp/gk:/etc/gatekeeper:ro "$tag" check

  release:
    name: release
    needs: [test, image]
    if: needs.test.outputs.release == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # Das Einzige, wofuer dieser Job Schreibrecht braucht.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble the deploy bundle
        # Alles, was auf dem Host gebraucht wird, ohne das Repo zu klonen.
        run: |
          dir="gatekeeper-${{ needs.test.outputs.version }}"
          mkdir -p "bundle/$dir"
          cp compose.yaml README.md RELEASE.md "bundle/$dir/"
          cp -r config "bundle/$dir/"
          tar -C bundle -czf "$dir-deploy.tar.gz" "$dir"

      - name: Compose the notes
        env:
          VERSION: ${{ needs.test.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "([[:space:]]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' RELEASE.md > notes.md

          # Zitierter Heredoc: im Text wird nichts expandiert, Backticks und
          # Dollarzeichen bleiben, wie sie dastehen. Die Werte kommen danach
          # ueber Platzhalter herein.
          cat >> notes.md <<'EOF'

          ---

          ## Image

          ```bash
          docker pull __IMAGE__:__VERSION__
          ```

          Im Betrieb den Digest pinnen statt des Tags -- ein Tag laesst sich
          ueberschreiben, ein Digest nicht:

          ```
          __IMAGE__@__DIGEST__
          ```

          Gebaut fuer `linux/amd64` und `linux/arm64`. Das Buendel unten
          enthaelt `compose.yaml` und die Beispielkonfigurationen.
          EOF

          sed -i "s|__IMAGE__|$IMAGE|g; s|__VERSION__|$VERSION|g; s|__DIGEST__|$DIGEST|g" notes.md

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "gatekeeper $VERSION"
          git push origin "v$VERSION"

          # Ein Tag wie v1.0.0-rc1 ist eine Vorabversion und wird nicht als
          # neueste Fassung angeboten.
          case "$VERSION" in
            *-*) prerelease="--prerelease" ;;
            *)   prerelease="" ;;
          esac
          gh release create "v$VERSION" \
            --title "gatekeeper $VERSION" \
            --notes-file notes.md \
            --verify-tag \
            $prerelease \
            "gatekeeper-$VERSION-deploy.tar.gz"
