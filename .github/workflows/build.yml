name: build

# Every change is a release. It is not triggered by a hand-set tag but by
# the version in pyproject.toml: if it names a version that has no tag yet,
# that version gets released. A release is therefore born in the same commit
# as the change -- and forgetting to bump the version shows up as nothing
# appearing.
#
# Separate jobs with a dependency: release happens only once the tests have
# passed. gatekeeper holds root-equivalent access to the host; an image with
# a red negative corpus must not reach the registry.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: davidsteg/gatekeeper

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      series: ${{ steps.version.outputs.series }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to detect whether this version has already been
          # released.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Decide whether this is a release
        id: version
        run: |
          version=$(python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # '1.2' points at the newest 1.2.x -- whoever pins the series gets
          # bug fixes but no new features.
          echo "series=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml ($version)." \
                 "An image would report a version it does not have."
            exit 1
          fi

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version is already released -- building a dev image only."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A version without notes does not get released. The check sits
          # here, ahead of the image job: if it fails, nothing has landed in
          # the registry yet that would then be missing its release.
          notes=$(awk -v v="$version" '
            $0 ~ "^## " v "([[:space:]]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' RELEASE.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::RELEASE.md has no '## $version' section." \
                 "Every change gets a release, and every release gets notes."
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "Will release v$version ($(echo "$notes" | wc -l) lines of notes)."

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test suite
        # On Linux the cases skipped on Windows also run -- most notably the
        # symlink escape from the negative corpus.
        run: pytest -q

      - name: Validate the empty state
        # The path every fresh install takes. It has to lead to a state that
        # loads -- without anything being preconfigured.
        run: |
          gatekeeper init --config-dir /tmp/blank | tee /tmp/init.log
          grep -q 'toolkits: {}' /tmp/blank/toolkits.yaml
          grep -q 'tools: \[\]' /tmp/blank/tools.yaml
          gatekeeper \
            --toolkits /tmp/blank/toolkits.yaml \
            --tools /tmp/blank/tools.yaml \
            --identities /tmp/blank/identities.yaml \
            check | tee /tmp/check.log
          grep -q '0 toolkits, 0 tools, 1 identities' /tmp/check.log

      - name: Validate the examples
        # The examples are what somebody copies from. A typo in them would
        # otherwise surface for the first time on somebody else's host.
        run: |
          hash=$(gatekeeper token | grep -oE 'scrypt\$[^[:space:]]+')
          printf 'identities:\n  - id: ci\n    role: admin\n    token_hash: "%s"\n    tools: []\n    scopes: []\n' \
            "$hash" > /tmp/identities.yaml
          gatekeeper \
            --toolkits config/examples/toolkits.yaml \
            --tools config/examples/tools.yaml \
            --identities /tmp/identities.yaml \
            check

  image:
    name: image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # The digest travels into the release: a tag can be overwritten, a
      # digest cannot. Whoever pins to it afterwards is guaranteed this image.
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # For linux/arm64 on an amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # On pull requests only building happens, not publishing: a fork
        # would otherwise be able to push an image under our name via a PR.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        env:
          VERSION: ${{ needs.test.outputs.version }}
          RELEASING: ${{ needs.test.outputs.release }}
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # Versions only, no branch or commit names: a tag like
          # 'sha-c8598dc' says nothing about what is inside.
          #
          # If the version is new, '1.2.3' and '1.2' are produced. If it is
          # already released, '1.2.3-dev' appears instead -- recognizably
          # unfinished and still a version.
          #
          # 'latest' always points at the newest build, without exception.
          # Since the rule in RELEASE.md makes every change a release, that is
          # as a rule also the newest release; a '-dev' in between is the
          # exception. For operation a pinned version stays correct
          # (NFR-5) -- 'latest' moves, and a redeploy then pulls a different
          # build without anyone having decided that.
          tags: |
            type=raw,value=${{ env.VERSION }},enable=${{ env.RELEASING == 'true' }}
            type=raw,value=${{ needs.test.outputs.series }},enable=${{ env.RELEASING == 'true' }}
            type=raw,value=${{ env.VERSION }}-dev,enable=${{ env.RELEASING != 'true' }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        # Reproduces a fresh install inside the container: 'init' writes the
        # empty state, 'check' reads it back. Both unprivileged.
        if: github.event_name != 'pull_request'
        run: |
          # Deliberately 'latest': after every push it points at exactly this
          # build, regardless of the order the tags were produced in.
          tag="${IMAGE}:latest"
          docker pull "$tag"
          docker run --rm --entrypoint docker "$tag" compose version
          mkdir -p /tmp/gk && chmod 777 /tmp/gk
          docker run --rm --user 568:568 -v /tmp/gk:/etc/gatekeeper "$tag" init
          docker run --rm --user 568:568 -v /tmp/gk:/etc/gatekeeper:ro "$tag" check

  release:
    name: release
    needs: [test, image]
    if: needs.test.outputs.release == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # The only thing this job needs write access for.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble the deploy bundle
        # Everything needed on the host, without cloning the repo.
        run: |
          dir="gatekeeper-${{ needs.test.outputs.version }}"
          mkdir -p "bundle/$dir"
          cp compose.yaml README.md RELEASE.md "bundle/$dir/"
          cp -r config "bundle/$dir/"
          tar -C bundle -czf "$dir-deploy.tar.gz" "$dir"

      - name: Compose the notes
        env:
          VERSION: ${{ needs.test.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "([[:space:]]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' RELEASE.md > notes.md

          # Quoted heredoc: nothing in the text gets expanded, backticks and
          # dollar signs stay exactly as written. The values come in
          # afterwards through placeholders.
          cat >> notes.md <<'EOF'

          ---

          ## Image

          ```bash
          docker pull __IMAGE__:__VERSION__
          ```

          In production, pin the digest instead of the tag -- a tag can be
          overwritten, a digest cannot:

          ```
          __IMAGE__@__DIGEST__
          ```

          Built for `linux/amd64` and `linux/arm64`. The bundle below
          contains `compose.yaml` and the example configurations.
          EOF

          sed -i "s|__IMAGE__|$IMAGE|g; s|__VERSION__|$VERSION|g; s|__DIGEST__|$DIGEST|g" notes.md

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "gatekeeper $VERSION"
          git push origin "v$VERSION"

          # A tag like v1.0.0-rc1 is a pre-release and is not offered as the
          # latest build.
          case "$VERSION" in
            *-*) prerelease="--prerelease" ;;
            *)   prerelease="" ;;
          esac
          gh release create "v$VERSION" \
            --title "gatekeeper $VERSION" \
            --notes-file notes.md \
            --verify-tag \
            $prerelease \
            "gatekeeper-$VERSION-deploy.tar.gz"
