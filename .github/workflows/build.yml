name: build

# Getrennte Jobs mit Abhaengigkeit: ein Image wird nur veroeffentlicht, wenn
# die Tests vorher durchgelaufen sind. gatekeeper haelt root-aequivalenten
# Zugriff auf den Host -- ein Image mit rotem Negativkorpus darf nicht in die
# Registry gelangen.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: davidsteg/gatekeeper

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test suite
        # Unter Linux laufen auch die Faelle, die unter Windows uebersprungen
        # werden -- allen voran der Symlink-Ausbruch aus dem Negativkorpus.
        run: pytest -q

      - name: Validate the shipped configuration
        # Prueft toolkits.yaml und tools.yaml streng gegen Ebene 1 und uebt
        # zugleich CLI und Token-Erzeugung. Ein Tippfehler in der
        # ausgelieferten Konfiguration faellt hier auf, nicht auf dem Host.
        run: |
          hash=$(gatekeeper token | grep -oE 'scrypt\$[^[:space:]]+')
          printf 'identities:\n  - id: ci\n    role: admin\n    token_hash: "%s"\n    tools: []\n    scopes: []\n' \
            "$hash" > /tmp/identities.yaml
          gatekeeper \
            --toolkits config/toolkits.yaml \
            --tools config/tools.yaml \
            --identities /tmp/identities.yaml \
            check

  image:
    name: image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Fuer linux/arm64 auf einem amd64-Runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Bei Pull Requests wird nur gebaut, nicht veroeffentlicht: ein Fork
        # duerfte sonst ueber einen PR ein Image unter unserem Namen schieben.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Kein 'latest'. Das Deployment pinnt einen Tag (NFR-5); ein
          # bewegliches 'latest' anzubieten lockt genau in den Zustand, vor dem
          # die Anforderung warnt -- ein Redeploy zieht dann unbemerkt eine
          # andere Version.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        # Das Image erzeugt sich seinen eigenen Token und prueft damit die
        # mitgelieferte Konfiguration -- unprivilegiert und ohne Docker-Socket.
        # Beweist, dass Interpreter, Abhaengigkeiten, Binaries an den in
        # toolkits.yaml genannten Pfaden und das Compose-Plugin zusammenpassen.
        if: github.event_name != 'pull_request'
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker pull "$tag"
          docker run --rm "$tag" --help > /dev/null
          docker run --rm --entrypoint docker "$tag" compose version

          mkdir -p /tmp/gk && cp config/toolkits.yaml config/tools.yaml /tmp/gk/
          hash=$(docker run --rm "$tag" token | grep -oE 'scrypt\$[^[:space:]]+')
          printf 'identities:\n  - id: ci\n    role: admin\n    token_hash: "%s"\n    tools: []\n    scopes: []\n' \
            "$hash" > /tmp/gk/identities.yaml
          docker run --rm --user 568:568 -v /tmp/gk:/etc/gatekeeper:ro "$tag" check
