# EXAMPLE - not the shipped configuration.
#
# Tier 1, deploy-time, immutable at runtime (REQUIREMENTS.md §6).
# This file is mounted read-only into the container. Changes require
# a redeploy. The UI can create tools, but never a toolkit
# - otherwise Tier 1 would be mutable at runtime (FR-4.11).
#
# Tier 1 defines what is at most possible. It is the only place
# where an error is no longer caught - time belongs here.
# None of this is a sensible default for a foreign system:
#
#   - The binary paths must exist in the image.
#   - The path roots must match the real compose directories.
#   - The protected resources must carry the names of YOUR critical stacks.
#     'traefik' below is a guess; if your reverse proxy is named
#     differently, the entry protects nothing.
#
# Adopting means: read, adapt, understand - not copy.

# FR-8.3g: named destinations a toolkit may reach, in addition to (or
# instead of) the single implicit target it would otherwise use. A
# destination carries only connection info and an optional credential
# override -- never binaries/denied_args/path_roots/limits, which stay on
# the toolkit and are identical across every destination it declares
# (FR-4.9: those answer "what is allowed", not "where"). A toolkit that
# lists no destinations behaves exactly as before this section existed.
destinations:
  # The host gatekeeper itself runs on -- same socket the 'docker' toolkit
  # would use with no destinations declared at all.
  nas1:
    docker_host: "unix:///var/run/docker.sock"
  # A second, remote Docker host, reached over TLS. 'docker-nas2-tls' is a
  # credential of kind 'docker_tls' (a JSON bundle of cert/key/ca PEM
  # material) created via /ui/credentials -- never in this file (FR-10.1).
  nas2:
    docker_host: "tcp://nas2.lan:2376"
    docker_tls: true
    credential: docker-nas2-tls

toolkits:
  docker:
    executor: docker
    # FR-8.3h: docker.compose_up etc. below expand at catalog-load time
    # into docker.compose_up@nas1 and docker.compose_up@nas2 -- two
    # independently grantable tool IDs, see identities.yaml.
    destinations: [nas1, nas2]
    binaries:
      - /usr/bin/docker
    # FR-4.2: blocked subcommands and flags. The *resolved* argv is checked
    # - a parameter value that becomes one of these words is caught just the same.
    denied_args:
      - rm
      - kill
      - exec
      - build
      - push
      - login
      - system
      - prune
      - cp
      - --privileged
      - --force
      # 'compose down -v' deletes volumes. No tool needs that, so blocked.
      - -v
      - --volumes
      - --rmi
    path_roots:
      - /mnt/raid
    # FR-4.12: blocked independent of permissions and scopes.
    # 'gatekeeper' terminates itself with this - the response never reaches
    # the agent, it evaluates it as a timeout, and nobody is left to answer.
    # 'dockhand' is the deployment mechanism: whoever shuts it down loses the
    # tool with which they would turn it back on.
    protected_resources:
      - gatekeeper
      - dockhand
      - ix-dockhand
      - traefik
    max_timeout_seconds: 300
    max_output_bytes: 262144

  diag:
    executor: local
    binaries:
      - /usr/bin/uptime
      - /usr/bin/free
      - /usr/bin/df
      - /bin/cat
    denied_args: []
    # Deliberately empty: no diagnostic tool takes a path from the agent.
    path_roots: []
    protected_resources: []
    max_timeout_seconds: 10
    max_output_bytes: 16384

  # FR-8.5 to FR-8.15: an `http` toolkit. Scheme and host live exclusively
  # here, never in a tool definition or a parameter. `allowed_cidrs` is
  # GitHub's published API address range -- for a LAN service (Sonarr,
  # Home Assistant, ...) this would instead be the narrow /32 or /24 that
  # actually covers that one host, never a blanket private range (FR-8.15).
  # `credential: github` refers to a credential created via /ui/credentials
  # or 'gatekeeper credential-key' + the admin API -- the value is never in
  # this file (FR-10.1).
  github:
    executor: http
    base_url: "https://api.github.com"
    allowed_methods: ["GET", "POST"]
    allowed_path_prefixes:
      - /repos/davidsteg/
      - /user/repos
    allowed_cidrs:
      - 140.82.112.0/20
      - 143.55.64.0/20
      - 192.30.252.0/22
    credential: github
    max_timeout_seconds: 20
    max_output_bytes: 131072

  # FR-8.3a-f: `truenas` is its own executor -- JSON-RPC 2.0 over
  # WebSocket, not REST (TrueNAS's REST v2.0 is deprecated as of 25.04).
  # The whitelist here acts on method *names*: 'pool.dataset.delete'
  # simply never appears, so no tool can ever call it.
  truenas:
    executor: truenas
    ws_url: "wss://truenas.lan/api/current"
    allowed_rpc_methods:
      - pool.query
      - pool.dataset.query
      - pool.dataset.create
      - zfs.snapshot.query
      - zfs.snapshot.delete
    credential: truenas
    max_timeout_seconds: 30
    max_output_bytes: 65536

  # REQUIREMENTS.md §17: `ssh` reuses the docker/local binary+argv model
  # (FR-5.3/5.4) exactly, just executed on a remote host over SSH instead
  # of a local subprocess. Host-key verification is mandatory, not
  # optional -- ssh_known_hosts is the output of
  # 'ssh-keyscan -t ed25519 diag-host.lan', pinned here so a redeploy is
  # required to point this toolkit at a different host key (same posture
  # as FR-8.9's DNS-rebinding check for the http executor).
  linux:
    executor: ssh
    ssh_host: diag-host.lan
    ssh_port: 22
    ssh_user: gatekeeper
    ssh_known_hosts: "diag-host.lan ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI..."
    binaries: ["/usr/bin/uptime", "/usr/bin/free", "/usr/bin/df"]
    denied_args: []
    path_roots: []
    credential: linux
    max_timeout_seconds: 15
    max_output_bytes: 16384

  # FR-8.16/8.17: the `file` executor. No binary and no argv -- each tool
  # declares one fixed operation (read/write/patch/list), so there is no
  # argument surface to allowlist. Giving an agent the same reach through
  # `local` would mean enabling /bin/cat, /usr/bin/tee, /bin/sed and then
  # arguing about their flags.
  #
  # path_roots is the whole target restriction here, the way
  # allowed_path_prefixes is for http -- keep it as narrow as the job
  # actually needs.
  agentcfg:
    executor: file
    binaries: []
    path_roots:
      - /mnt/raid/agent
    protected_resources: [gatekeeper, dockhand, traefik]
    max_timeout_seconds: 15
    max_output_bytes: 262144

    # FR-8.18: which OS user these operations run as. Commented out on
    # purpose -- this is the one line in this file that changes *with whose
    # authority* a call runs, not what is allowed, and it is not free:
    #
    #   * It only makes sense when the files genuinely belong to someone
    #     else (a directory that is drwx------ under another uid). If the
    #     container user can already read them, leave it unset.
    #   * The container must then start as root with cap_add SETUID and
    #     SETGID -- see docs/DEPLOYMENT.md. Without that privilege calls on
    #     this toolkit FAIL; they never quietly run as the container user.
    #   * Prefer the owning uid over root. '3001:3001' is bounded by that
    #     user's own permissions; root additionally needs CAP_DAC_OVERRIDE,
    #     which reads every file on every mount.
    #   * An admin agent can propose changing it over /admin/mcp, but only
    #     a human approving it at /ui/requests makes it live -- and neither
    #     can grant the container the capability to honour it, nor widen
    #     path_roots below (FR-8.20a).
    #
    # Either an account inside the image, or the numeric 'uid:gid' pair for
    # a host uid that has no passwd entry there (a bare '3001' is rejected:
    # the group would be left to a lookup that cannot succeed).
    #
    # run_as: "3001:3001"

  # FR-8.3a-f counterpart: the `google` executor runs `google_api.py` as a
  # local subprocess (shell=False, argv list -- FR-5.3/5.4/6.1), the same
  # model as `local`/`docker`, but the whitelist acts on *action strings*
  # ("gmail search", "drive create-folder") instead of binaries, exactly
  # like `allowed_rpc_methods` for truenas. OAuth2 is the one thing the
  # `http` executor cannot do (FR-8.11) -- it only supports static
  # credentials.
  #
  # OAuth2 credentials live in the credential store as a JSON bundle
  # (kind=oauth2), created via /ui/credentials -- never in this file
  # (FR-10.1). One credential named 'google' serves all three toolkits,
  # and the refresh token's consent must cover every scope the tools need.
  #
  # `google_script` is the absolute path to google_api.py inside the
  # container. The script is baked into the image at
  # /opt/gatekeeper/google/google_api.py (Dockerfile COPY) -- no host
  # mount required. If it lives in another container on the same Docker
  # host instead, set `google_container` to that container's name -- the
  # executor then runs `docker exec <container> python <script> ...`.
  gmail:
    executor: google
    google_script: /opt/gatekeeper/google/google_api.py
    allowed_google_actions:
      - gmail search
      - gmail get
      - gmail send
      - gmail reply
      - gmail labels
      - gmail modify
    credential: google
    max_timeout_seconds: 30
    max_output_bytes: 131072

  calendar:
    executor: google
    google_script: /opt/gatekeeper/google/google_api.py
    allowed_google_actions:
      - calendar list
      - calendar create
      - calendar delete
    credential: google
    max_timeout_seconds: 30
    max_output_bytes: 131072

  drive:
    executor: google
    google_script: /opt/gatekeeper/google/google_api.py
    allowed_google_actions:
      - drive search
      - drive get
      - drive upload
      - drive download
      - drive create-folder
      - drive share
      - drive delete
    credential: google
    # drive.upload / drive.download paths are sandboxed here -- an agent
    # can only move files between Drive and this directory, never
    # exfiltrate arbitrary gatekeeper files to Drive. Lives under
    # /etc/gatekeeper (the existing config mount, writable).
    path_roots:
      - /etc/gatekeeper/google-transfer
    max_timeout_seconds: 60
    max_output_bytes: 131072

  # The `opencode` executor: a headless opencode server on the LAN, driven
  # over its own HTTP API. Same two target fields as an `http` toolkit and
  # for the same reasons -- `base_url` is the only place a scheme and host
  # may appear (FR-8.5), `allowed_cidrs` is what the executor re-checks the
  # resolved IP against before *every* request of a workflow (FR-8.9), so
  # keep it the narrow /32 that covers that one host (FR-8.15).
  #
  # What differs from `http`: one call is a fixed multi-request workflow,
  # not a single request, so the whitelist acts on operation names --
  # exactly like allowed_rpc_methods for truenas. `run` simply never
  # appears in a toolkit meant only to report on somebody else's sessions.
  # There is no allowed_path_prefixes: the request paths are fixed in
  # execute_opencode.py, not composed from a tool definition.
  #
  # `path_roots` is what an agent's `directory` parameter is checked
  # against -- the project roots opencode may ever be pointed at. Without
  # it, no tool on this toolkit may offer `directory` at all.
  #
  # No credential line by default: opencode ships without auth. If you set
  # OPENCODE_SERVER_PASSWORD on the server, create a `basic` credential
  # (value "<user>:<password>") and name it here.
  opencode:
    executor: opencode
    base_url: "http://opencode.lan:4096"
    allowed_cidrs:
      - 10.10.200.90/32
    allowed_opencode_operations:
      - ask
      - run
      - fire
      - check
      - review_changes
      - abort
      - providers
      - health
    path_roots:
      - /mnt/raid/projects
    # A `run` drives a coding agent to completion -- minutes, not seconds.
    # The ceiling belongs here; each tool stays below it (FR-4.5).
    max_timeout_seconds: 900
    max_output_bytes: 131072
    # credential: opencode

# FR-6.8
rate_limits:
  read:
    count: 120
    window_seconds: 60
  write:
    count: 20
    window_seconds: 60
  write_external:
    count: 5
    window_seconds: 60

max_concurrent: 4

# FR-9.4/9.5 - append-only with rotation. Without rotation the log fills the dataset.
audit:
  # A path inside the container, not on the host -- compose maps your
  # storage onto it. /var/log/gatekeeper is the standard place; keeping it
  # out of /etc/gatekeeper is what lets that mount be :ro.
  dir: /var/log/gatekeeper
  max_bytes: 33554432
  keep_files: 10