# EXAMPLE - not the shipped configuration.
#
# Tier 1, deploy-time, immutable at runtime (REQUIREMENTS.md §6).
# This file is mounted read-only into the container. Changes require
# a redeploy. The UI can create tools, but never a toolkit
# - otherwise Tier 1 would be mutable at runtime (FR-4.11).
#
# Tier 1 defines what is at most possible. It is the only place
# where an error is no longer caught - time belongs here.
# None of this is a sensible default for a foreign system:
#
#   - The binary paths must exist in the image.
#   - The path roots must match the real compose directories.
#   - The protected resources must carry the names of YOUR critical stacks.
#     'traefik' below is a guess; if your reverse proxy is named
#     differently, the entry protects nothing.
#
# Adopting means: read, adapt, understand - not copy.

toolkits:
  docker:
    executor: docker
    binaries:
      - /usr/bin/docker
    # FR-4.2: blocked subcommands and flags. The *resolved* argv is checked
    # - a parameter value that becomes one of these words is caught just the same.
    denied_args:
      - rm
      - kill
      - exec
      - build
      - push
      - login
      - system
      - prune
      - cp
      - --privileged
      - --force
      # 'compose down -v' deletes volumes. No tool needs that, so blocked.
      - -v
      - --volumes
      - --rmi
    path_roots:
      - /mnt/raid
    # FR-4.12: blocked independent of permissions and scopes.
    # 'gatekeeper' terminates itself with this - the response never reaches
    # the agent, it evaluates it as a timeout, and nobody is left to answer.
    # 'dockhand' is the deployment mechanism: whoever shuts it down loses the
    # tool with which they would turn it back on.
    protected_resources:
      - gatekeeper
      - dockhand
      - ix-dockhand
      - traefik
    max_timeout_seconds: 300
    max_output_bytes: 262144

  diag:
    executor: local
    binaries:
      - /usr/bin/uptime
      - /usr/bin/free
      - /usr/bin/df
      - /bin/cat
    denied_args: []
    # Deliberately empty: no diagnostic tool takes a path from the agent.
    path_roots: []
    protected_resources: []
    max_timeout_seconds: 10
    max_output_bytes: 16384

# FR-6.8
rate_limits:
  read:
    count: 120
    window_seconds: 60
  write:
    count: 20
    window_seconds: 60
  write_external:
    count: 5
    window_seconds: 60

max_concurrent: 4

# FR-9.4/9.5 - append-only with rotation. Without rotation the log fills the dataset.
audit:
  dir: /mnt/raid/gatekeeper/logs
  max_bytes: 33554432
  keep_files: 10