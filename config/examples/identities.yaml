# BEISPIEL - `gatekeeper init` legt eine echte identities.yaml mit genau einem
# Administrator an. Diese Datei zeigt nur, wie Rechteprofile aussehen koennen.
#
# Identitaeten und Rechte (REQUIREMENTS.md §4 und §9).
#
# Sie enthaelt NUR Hashes. Der Klartext-Token existiert an genau zwei Stellen:
# einmalig bei der Erzeugung und in der config.yaml des Agenten (FR-2.6).
# Damit ist die Datei nicht secret-kritisch und darf nach Homelab-Regel im
# Dataset mit chown 568:568 liegen.
#
# Zwei getrennte Nachweise je Identitaet:
#   token_hash     - fuer die API (/mcp), als 'Authorization: Bearer'
#   password_hash  - fuer die Anmeldung an der Konsole (/ui)
# Ein Agent bekommt nur einen Token; er meldet sich nirgends an. 'viewer' und
# 'admin' brauchen ein Passwort, sonst kaemen sie nicht in die Oberflaeche.
# Getrennt sind sie, damit ein verlorenes Geheimnis nicht beide Wege oeffnet -
# und damit der Token nicht durch einen Browser wandern muss (FR-11.5).
#
# Token-Hash erzeugen:
#   docker exec gatekeeper gatekeeper token
#
# Konsolenpasswort setzen (schreibt direkt in identities.yaml):
#   docker exec gatekeeper gatekeeper password --identity root
#
# Die Platzhalter muessen ersetzt werden - mit REPLACE_ME verweigert
# gatekeeper den Start, statt zu laufen und jeden Token abzulehnen.
#
# Die Agenten unten verweisen auf Tools aus examples/tools.yaml. Existieren
# die nicht, laufen die Rechte ins Leere; die Oberflaeche zeigt das an.

identities:
  # -- Menschen an der Oberflaeche ---------------------------------------
  # `admin` darf Ebene 2 aendern (Tools, Identitaeten, Tokens), `viewer` nur
  # lesen. Ohne mindestens einen der beiden startet der Server mit --ui nicht.
  # Beide brauchen keine Tool-Rechte: die Oberflaeche ruft nichts auf.
  #
  # Angemeldet wird mit 'password_hash', nicht mit dem Token. Fehlt das
  # Passwort, legt der erste Start mit --ui eines an und schreibt es einmalig
  # ins Log - ein Konsolenkonto ohne Passwort waere ein Zugang, den es nicht
  # gibt.
  - id: root
    role: admin
    token_hash: "scrypt$REPLACE_ME"
    password_hash: "scrypt$REPLACE_ME"
    tools: []
    scopes: []

  - id: watch
    role: viewer
    token_hash: "scrypt$REPLACE_ME"
    password_hash: "scrypt$REPLACE_ME"
    tools: []
    scopes: []

  # -- Agenten am MCP-Endpunkt -------------------------------------------
  - id: homelab
    role: agent
    token_hash: "scrypt$REPLACE_ME"
    # FR-7.5: Rechte werden auf einzelne Tool-IDs erteilt, nie auf ein Toolkit.
    # Wildcards sind hier bewusst nicht zulaessig - sonst besaesse diese
    # Identitaet jedes kuenftig angelegte Tool automatisch mit.
    tools:
      - docker.compose_ps
      - docker.compose_logs
      - docker.compose_up
      - docker.compose_down
      - docker.compose_restart
      - docker.compose_pull
      - diag.uptime
      - diag.memory
      - diag.disk
      - diag.loadavg
    scopes:
      - "stack:*"

  - id: media
    role: agent
    token_hash: "scrypt$REPLACE_ME"
    tools:
      - docker.compose_ps
      - docker.compose_logs
      - diag.uptime
      - diag.memory
      - diag.disk
    scopes:
      - "stack:media-*"
      - "stack:jellyfin*"
      - "stack:sonarr"
      - "stack:radarr"

  - id: dev
    role: agent
    token_hash: "scrypt$REPLACE_ME"
    tools:
      - docker.compose_ps
      - docker.compose_logs
      - docker.compose_up
      - docker.compose_down
      - docker.compose_restart
      - diag.uptime
      - diag.memory
      - diag.disk
    scopes:
      - "stack:dev-*"
