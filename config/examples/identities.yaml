# EXAMPLE - `gatekeeper init` creates a real identities.yaml with exactly one
# administrator. This file only shows what permission profiles can look like.
#
# Identities and permissions (REQUIREMENTS.md §4 and §9).
#
# It contains ONLY hashes. The plain-text token exists in exactly two places:
# once at generation time and in the agent's config.yaml (FR-2.6).
# This means the file is not secret-critical and may sit in the dataset
# with chown 568:568 by homelab convention.
#
# Two separate proofs per identity:
#   token_hash     - for the API (/mcp), as 'Authorization: ***'
#   password_hash  - for signing in at the console (/ui)
# An agent gets only a token; it signs in nowhere. 'viewer' and
# 'admin' need a password, otherwise they cannot get into the UI.
# They are separate so that a lost secret does not open both paths -
# and so the token does not have to wander through a browser (FR-11.5).
#
# Generate a token hash:
#   docker exec gatekeeper gatekeeper token
#
# Set a console password (writes directly to identities.yaml):
#   docker exec gatekeeper gatekeeper password --identity root
#
# The placeholders must be replaced - with REPLACE_ME gatekeeper
# refuses to start, instead of running and rejecting every token.
#
# The agents below reference tools from examples/tools.yaml. If those
# do not exist, the permissions run into the void; the UI shows that.

identities:
  # -- Humans at the UI -----------------------------------------------------
  # `admin` may change Tier 2 (tools, identities, tokens), `viewer` only
  # reads. Without at least one of the two, the server does not start with --ui.
  # Both need no tool rights: the UI calls nothing.
  #
  # Sign-in is via 'password_hash', not the token. If the
  # password is missing, the first start with --ui creates one and writes it
  # to the log once - a console account without a password would be an
  # access that does not exist.
  - id: root
    role: admin
    token_hash: "scrypt$REPLACE_ME"
    password_hash: "scrypt$REPLACE_ME"
    tools: []
    scopes: []

  - id: watch
    role: viewer
    token_hash: "scrypt$REPLACE_ME"
    password_hash: "scrypt$REPLACE_ME"
    tools: []
    scopes: []

  # -- Agents at the MCP endpoint -------------------------------------------
  - id: homelab
    role: agent
    token_hash: "scrypt$REPLACE_ME"
    # FR-7.5: permissions are granted to individual tool IDs, never to a toolkit.
    # Wildcards are deliberately not permitted here - otherwise this
    # identity would automatically possess every tool created in the future.
    #
    # FR-8.3h: examples/toolkits.yaml gives 'docker' two destinations
    # (nas1, nas2), so every docker.* tool ID here needs the '@nas1' or
    # '@nas2' suffix -- a bare 'docker.compose_up' no longer exists once a
    # toolkit declares destinations. This identity gets nas1 (the local
    # host) only; a separate grant would be needed for nas2.
    tools:
      - docker.compose_ps@nas1
      - docker.compose_logs@nas1
      - docker.compose_up@nas1
      - docker.compose_down@nas1
      - docker.compose_restart@nas1
      - docker.compose_pull@nas1
      - diag.uptime
      - diag.memory
      - diag.disk
      - diag.loadavg
    scopes:
      - "stack:*"

  - id: media
    role: agent
    token_hash: "scrypt$REPLACE_ME"
    tools:
      - docker.compose_ps@nas1
      - docker.compose_logs@nas1
      - diag.uptime
      - diag.memory
      - diag.disk
    scopes:
      - "stack:media-*"
      - "stack:jellyfin*"
      - "stack:sonarr"
      - "stack:radarr"

  - id: dev
    role: agent
    token_hash: "scrypt$REPLACE_ME"
    tools:
      - docker.compose_ps@nas1
      - docker.compose_logs@nas1
      - docker.compose_up@nas1
      - docker.compose_down@nas1
      - docker.compose_restart@nas1
      - diag.uptime
      - diag.memory
      - diag.disk
    scopes:
      - "stack:dev-*"