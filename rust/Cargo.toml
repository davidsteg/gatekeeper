[package]
name = "gatekeeper"
# The release version: what the binary, `/mcp`'s serverInfo and the image
# tag report. Every change on main bumps it (RELEASE.md); CI reads it here.
version = "1.25.0"
edition = "2021"
rust-version = "1.85"
description = "MCP server for controlled host operations"
license = "MIT"
publish = false

[lib]
name = "gatekeeper"
path = "src/lib.rs"

[[bin]]
name = "gatekeeper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
pcre2 = "0.2"
# zlib backend: gzip output byte-identical to Python's (same libz).
flate2 = { version = "1", default-features = false, features = ["zlib"] }
fernet = { version = "0.2", default-features = false, features = ["rustcrypto", "fernet_danger_timestamps"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
indexmap = { version = "2", features = ["serde"] }
ipnet = "2"
libc = "0.2"
md5 = "0.7"
once_cell = "1"
parking_lot = "0.12"
percent-encoding = "2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
russh = "0.54"
# http executor: its own TLS stream to the checked IP (same crates reqwest uses).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scrypt = { version = "0.11", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sha1 = "0.10"
shlex = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
yaml-rust2 = "0.10"

# Privilege probes re-execute the test binary and must run on its main
# thread (capabilities are per thread), so this one has its own harness.
[[test]]
name = "privilege"
harness = false

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tempfile = "3"

[profile.dev]
# Full debuginfo makes each test binary ~100 MB; line tables keep backtraces.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# scrypt (identity hashes) is ~50x slower unoptimized; keep debug builds and
# tests usable.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
