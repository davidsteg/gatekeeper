# Deployment via Dockhand (REQUIREMENTS.md §14).
#
#   docker exec ix-dockhand-dockhand-1 \
#     docker compose -p gatekeeper -f /mnt/raid/gatekeeper/compose.yaml up -d

services:
  gatekeeper:
    # Fixed version, not :latest (NFR-5). A moving tag would pull a different
    # image on redeploy without anyone noticing -- and this service holds
    # root-equivalent access to the host.
    image: davidsteg/gatekeeper:0.1.0
    container_name: gatekeeper
    restart: unless-stopped

    # NFR-1: unprivileged. 568:568 is the homelab convention, and it is the
    # image's own default (Dockerfile: USER 568:568) -- this line restates it
    # rather than causing it. gatekeeper never changes its own uid at
    # runtime, so whatever the container is started as is what it stays.
    #
    # A `file` toolkit with `run_as` needs THIS LINE changed to "0:0", plus
    # the cap_add block further down. Change it here; do not add a second
    # `user:` key below. A mapping with two `user:` keys does not merge --
    # compose keeps one of them, and if it keeps this one you get the state
    # that looks like a gatekeeper bug: cap_add accepted, container still
    # 568:568, CapEff empty, every run_as call failing.
    user: "568:568"
    # The Docker socket belongs to root:docker on the host. For the
    # unprivileged user to use it, the container needs the GID of that
    # group. Check on the target host:
    #   stat -c '%g' /var/run/docker.sock
    group_add:
      - "999"

    # UI at /ui. Disabled by default; requires an identity with
    # role: viewer or role: admin. An admin can modify Tier 2, a viewer
    # can only read. With --ui-read-only the UI stays read-only even for
    # admins.
    # command: ["serve", "--ui"]

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Only if a `file` toolkit in toolkits.yaml declares `run_as` (FR-8.18):
    # becoming another user needs privilege this container deliberately does
    # not have, so it would have to start as root and get exactly these two
    # capabilities back. Everything else stays dropped, and no-new-privileges
    # stays on -- it blocks privilege *gain* via setuid binaries on execve,
    # not a privileged process dropping to a lesser user.
    #
    # BOTH halves are required. Uncommenting this on its own does nothing:
    # Docker puts these capabilities in the permitted set of uid 0 ONLY, so
    # while `user:` above still reads "568:568" the container comes up with
    # an empty CapEff and every run_as call fails with a message saying so.
    # Edit the `user:` line above to "0:0" -- there is deliberately no
    # `user:` key in this block to uncomment, because two of them in one
    # service is the failure that reads like a gatekeeper bug.
    #
    # To verify what the container actually got, rather than what the file
    # asks for:
    #   docker inspect -f '{{.Config.User}} {{.HostConfig.CapAdd}}' gatekeeper
    #   docker exec gatekeeper grep -E '^(Uid|CapEff):' /proc/self/status
    #
    # Do not do this speculatively: without `run_as` anywhere it buys
    # nothing, and with it, the owning uid is almost always the right target
    # rather than root (see docs/DEPLOYMENT.md).
    #
    # cap_add:            # requires user: "0:0" above
    #   - SETUID
    #   - SETGID
    #
    # Third setting, and the one that gives the uid back:
    # GATEKEEPER_DROP_TO (in `environment:` below) makes gatekeeper become
    # 568 itself right after start, keeping only these two capabilities.
    # The process then spends its life unprivileged, everything it writes
    # is 568-owned as before, and `run_as` still works because the kernel
    # checks the capability rather than the uid. Without it the container
    # simply stays root -- `run_as` works either way, this is about what
    # the other 99.9% of the process's life runs as.
    read_only: true
    tmpfs:
      - /tmp:size=16m

    ports:
      - "8080:8080"

    volumes:
      # FR-8.2: root-equivalent access to the host. Deliberately accepted,
      # because gatekeeper is precisely the whitelist that constrains it --
      # but it means: a bug in gatekeeper is a root bug.
      - /var/run/docker.sock:/var/run/docker.sock

      # ONE writable directory suffices. If empty, the first start creates
      # toolkits.yaml, tools.yaml and identities.yaml and writes the two
      # admin credentials ONCE to the container log -- the console password
      # for /ui and the API token for /mcp:
      #
      #   docker compose logs gatekeeper | grep 'Administrator'
      #
      # Change the password after first login at /ui/account, rotate the
      # token in the UI if needed -- so neither stays in the log.
      # To disable auto-bootstrap: set GATEKEEPER_NO_BOOTSTRAP=1 and run
      # 'gatekeeper init' manually.
      #
      # Deliberately NO single-file mount for toolkits.yaml. Docker creates
      # a directory when the mounted file does not exist on the host --
      # which is always the case on a fresh install. The container then
      # loops with "Is a directory", and a folder named toolkits.yaml is
      # left on the host. A directory mount avoids this problem.
      #
      # Tier 1 is protected by code here, not by the mount: there is no
      # function and no route that writes toolkits.yaml (FR-4.11), and a
      # test enforces this. To add an extra lock via mount, split the
      # directories -- see below.
      - /mnt/raid/gatekeeper/config:/etc/gatekeeper

      # Compose files of managed stacks. The path root from toolkits.yaml
      # must match this.
      - /mnt/raid:/mnt/raid

      # Audit log, writable. Host path left of the colon, container path
      # right of it, and they are deliberately different: where the log
      # lands on your storage is your layout, but inside the container it
      # belongs at the standard place for logs. Mapping the host path onto
      # itself (as this line used to) makes the in-container path an
      # artefact of somebody else's NAS.
      #
      # Must match 'audit.dir' in toolkits.yaml -- that is the value
      # gatekeeper actually writes to; this mount only makes it persist.
      - /mnt/raid/gatekeeper/logs:/var/log/gatekeeper

    environment:
      GATEKEEPER_CONFIG_DIR: /etc/gatekeeper
      GATEKEEPER_PORT: "8080"
      GATEKEEPER_LOG_LEVEL: INFO

      # Only with the run_as profile above (user: "0:0" + cap_add). Start
      # as root, then immediately become this uid:gid, keeping CAP_SETUID
      # and CAP_SETGID so `run_as` still works. Deliberately not baked into
      # the image: a container started as root *without* cap_add would then
      # refuse to boot, and that is somebody's working deployment today.
      #
      #   GATEKEEPER_DROP_TO: "568:568"

      # Extra capabilities to keep across the startup drop, beyond the
      # mandatory SETUID+SETGID. Comma-separated, in Docker cap_add
      # notation. The extras go into the run_as child's ambient set (via
      # permitted+inheritable+ambient), but NOT the server's effective set
      # -- so the server itself cannot use them, only a run_as child can
      # after execve. The common case is DAC_OVERRIDE+DAC_READ_SEARCH, so
      # run_as: root can read files owned by other users (mode 0600 etc).
      # Requires the same capabilities in cap_add above. See
      # docs/DEPLOYMENT.md.
      #
      #   GATEKEEPER_KEEP_CAPS: "DAC_OVERRIDE,DAC_READ_SEARCH"

      # Required as soon as any toolkit carries a `credential:` line.
      # Generate once with 'gatekeeper credential-key'; losing it means
      # re-entering every stored credential. A credentials.yaml with
      # entries but no key aborts startup rather than running with
      # masking silently off. See docs/DEPLOYMENT.md.
      #
      #   GATEKEEPER_CREDENTIAL_KEY: "<fernet key>"
      #
      # Preferred over the line above: mount the key as a file, so it
      # stays out of 'docker inspect' and the compose file itself.
      #
      #   GATEKEEPER_CREDENTIAL_KEY_FILE: /run/secrets/gatekeeper-credential-key

      # Optional hardening: split Tier 1 and Tier 2 into separate
      # directories. Then the config mount can be :ro while the UI still
      # writes. Both are directories -- the Docker trap above does not
      # apply.
      #
      #   GATEKEEPER_STATE_DIR: /var/lib/gatekeeper
      #
      # volumes:
      #   - /mnt/raid/gatekeeper/config:/etc/gatekeeper:ro      # toolkits.yaml
      #   - /mnt/raid/gatekeeper/state:/var/lib/gatekeeper      # tools + identities

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"