# Deployment via Dockhand (REQUIREMENTS.md §14).
#
#   docker exec ix-dockhand-dockhand-1 \
#     docker compose -p gatekeeper -f /mnt/raid/gatekeeper/compose.yaml up -d

services:
  gatekeeper:
    # Fixed version, not :latest (NFR-5). A moving tag would pull a different
    # image on redeploy without anyone noticing -- and this service holds
    # root-equivalent access to the host.
    image: davidsteg/gatekeeper:0.1.0
    container_name: gatekeeper
    restart: unless-stopped

    # NFR-1: unprivileged. 568:568 is the homelab convention.
    user: "568:568"
    # The Docker socket belongs to root:docker on the host. For the
    # unprivileged user to use it, the container needs the GID of that
    # group. Check on the target host:
    #   stat -c '%g' /var/run/docker.sock
    group_add:
      - "999"

    # UI at /ui. Disabled by default; requires an identity with
    # role: viewer or role: admin. An admin can modify Tier 2, a viewer
    # can only read. With --ui-read-only the UI stays read-only even for
    # admins.
    # command: ["serve", "--ui"]

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m

    ports:
      - "8080:8080"

    volumes:
      # FR-8.2: root-equivalent access to the host. Deliberately accepted,
      # because gatekeeper is precisely the whitelist that constrains it --
      # but it means: a bug in gatekeeper is a root bug.
      - /var/run/docker.sock:/var/run/docker.sock

      # ONE writable directory suffices. If empty, the first start creates
      # toolkits.yaml, tools.yaml and identities.yaml and writes the two
      # admin credentials ONCE to the container log -- the console password
      # for /ui and the API token for /mcp:
      #
      #   docker compose logs gatekeeper | grep 'Administrator'
      #
      # Change the password after first login at /ui/account, rotate the
      # token in the UI if needed -- so neither stays in the log.
      # To disable auto-bootstrap: set GATEKEEPER_NO_BOOTSTRAP=1 and run
      # 'gatekeeper init' manually.
      #
      # Deliberately NO single-file mount for toolkits.yaml. Docker creates
      # a directory when the mounted file does not exist on the host --
      # which is always the case on a fresh install. The container then
      # loops with "Is a directory", and a folder named toolkits.yaml is
      # left on the host. A directory mount avoids this problem.
      #
      # Tier 1 is protected by code here, not by the mount: there is no
      # function and no route that writes toolkits.yaml (FR-4.11), and a
      # test enforces this. To add an extra lock via mount, split the
      # directories -- see below.
      - /mnt/raid/gatekeeper/config:/etc/gatekeeper

      # Compose files of managed stacks. The path root from toolkits.yaml
      # must match this.
      - /mnt/raid:/mnt/raid

      # Audit log, writable.
      - /mnt/raid/gatekeeper/logs:/mnt/raid/gatekeeper/logs

    environment:
      GATEKEEPER_CONFIG_DIR: /etc/gatekeeper
      GATEKEEPER_PORT: "8080"
      GATEKEEPER_LOG_LEVEL: INFO

      # Optional hardening: split Tier 1 and Tier 2 into separate
      # directories. Then the config mount can be :ro while the UI still
      # writes. Both are directories -- the Docker trap above does not
      # apply.
      #
      #   GATEKEEPER_STATE_DIR: /var/lib/gatekeeper
      #
      # volumes:
      #   - /mnt/raid/gatekeeper/config:/etc/gatekeeper:ro      # toolkits.yaml
      #   - /mnt/raid/gatekeeper/state:/var/lib/gatekeeper      # tools + identities

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"