# Deployment via Dockhand (REQUIREMENTS.md §14).
#
#   docker exec ix-dockhand-dockhand-1 \
#     docker compose -p gatekeeper -f /mnt/raid/gatekeeper/compose.yaml up -d

services:
  gatekeeper:
    # Feste Version, nicht :latest (NFR-5). Ein bewegliches Tag zoege bei einem
    # Redeploy unbemerkt eine andere Fassung -- und dieser Dienst haelt
    # root-aequivalenten Zugriff auf den Host.
    image: davidsteg/gatekeeper:0.1.0
    container_name: gatekeeper
    restart: unless-stopped

    # NFR-1: unprivilegiert. 568:568 ist die Homelab-Konvention.
    user: "568:568"
    # Der Docker-Socket gehoert auf dem Host root:docker. Damit der
    # unprivilegierte Benutzer ihn nutzen kann, braucht der Container die GID
    # dieser Gruppe. Auf dem Ziel-Host pruefen:
    #   stat -c '%g' /var/run/docker.sock
    group_add:
      - "999"

    # Oberflaeche unter /ui. Standardmaessig aus; verlangt eine Identitaet mit
    # role: viewer oder role: admin. Ein admin darf Ebene 2 aendern, ein viewer
    # nur lesen. Mit --ui-read-only bleibt die Oberflaeche auch fuer Admins
    # schreibgeschuetzt.
    # command: ["serve", "--ui"]

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m

    ports:
      - "8080:8080"

    volumes:
      # FR-8.2: root-aequivalenter Zugriff auf den Host. Bewusst akzeptiert,
      # weil gatekeeper genau die Whitelist ist, die ihn einschraenkt - aber
      # es heisst: ein Fehler in gatekeeper ist ein Root-Fehler.
      - /var/run/docker.sock:/var/run/docker.sock

      # EIN beschreibbares Verzeichnis genuegt. Ist es leer, legt der erste
      # Start toolkits.yaml, tools.yaml und identities.yaml selbst an und
      # schreibt den Administrator-Token EINMALIG ins Containerlog:
      #
      #   docker compose logs gatekeeper | grep 'Administrator token'
      #
      # Nach dem ersten Anmelden in /ui rotieren, damit er nicht im Log bleibt.
      # Wer nichts automatisch angelegt haben will: GATEKEEPER_NO_BOOTSTRAP=1
      # setzen und 'gatekeeper init' von Hand aufrufen.
      #
      # Bewusst KEIN Einzeldatei-Mount fuer toolkits.yaml. Docker legt ein
      # Verzeichnis an, wenn die gemountete Datei auf dem Host nicht existiert
      # - bei einer Erstinstallation also immer. Der Container startet dann in
      # einer Schleife mit "Is a directory", und auf dem Host bleibt ein
      # Ordner namens toolkits.yaml zurueck. Ein Verzeichnis-Mount kennt das
      # Problem nicht.
      #
      # Ebene 1 ist hier durch Code geschuetzt, nicht durch den Mount: es gibt
      # keine Funktion und keine Route, die toolkits.yaml schreibt (FR-4.11),
      # und ein Test haelt das fest. Wer den Mount zusaetzlich als Riegel will,
      # trennt die Verzeichnisse - siehe unten.
      - /mnt/raid/gatekeeper/config:/etc/gatekeeper

      # Compose-Dateien der verwalteten Stacks. Die Pfad-Wurzel aus
      # toolkits.yaml muss hierauf passen.
      - /mnt/raid:/mnt/raid

      # Audit-Log, beschreibbar.
      - /mnt/raid/gatekeeper/logs:/mnt/raid/gatekeeper/logs

    environment:
      GATEKEEPER_CONFIG_DIR: /etc/gatekeeper
      GATEKEEPER_PORT: "8080"
      GATEKEEPER_LOG_LEVEL: INFO

      # Optionale Haertung: Ebene 1 und Ebene 2 in getrennte Verzeichnisse.
      # Dann kann der Konfigurations-Mount :ro sein, waehrend die Oberflaeche
      # weiterhin schreibt. Beides sind Verzeichnisse -- die Docker-Falle von
      # oben tritt dabei nicht auf.
      #
      #   GATEKEEPER_STATE_DIR: /var/lib/gatekeeper
      #
      # volumes:
      #   - /mnt/raid/gatekeeper/config:/etc/gatekeeper:ro      # toolkits.yaml
      #   - /mnt/raid/gatekeeper/state:/var/lib/gatekeeper      # tools + identities

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
